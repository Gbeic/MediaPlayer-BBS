name: 构建 MediaPlayer-BBS 完整 native 后端

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-native:
    name: Windows x64 native 构建
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - name: 检出源码
        uses: actions/checkout@v5

      - name: 配置 JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: 配置 MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: 安装 CUDA Toolkit
        uses: Jimver/cuda-toolkit@v0.2.35
        with:
          cuda: '12.9.1'
          method: network
          sub-packages: '["nvcc", "cudart", "visual_studio_integration"]'

      - name: 恢复 vcpkg 静态依赖缓存
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.vcpkg-binary-cache
          key: vcpkg-ffmpeg-static-md-release-${{ runner.os }}-v2

      - name: 构建 FFmpeg LGPL 静态开发库
        shell: pwsh
        run: |
          $vcpkg = Join-Path $env:VCPKG_INSTALLATION_ROOT 'vcpkg.exe'
          $binaryCache = Join-Path $env:GITHUB_WORKSPACE '.vcpkg-binary-cache'
          New-Item -ItemType Directory -Force -Path $binaryCache | Out-Null
          $env:VCPKG_BINARY_SOURCES = "clear;files,$binaryCache,readwrite"
          $overlayTriplets = Join-Path $env:GITHUB_WORKSPACE 'ci\vcpkg'
          & $vcpkg install 'ffmpeg[avcodec,avformat,nvcodec,swresample,swscale]:x64-windows-static-md-release' --overlay-triplets $overlayTriplets --clean-after-build
          if ($LASTEXITCODE -ne 0) { throw "vcpkg 构建 FFmpeg 失败，退出码：$LASTEXITCODE" }
          $ffmpegRoot = Join-Path $env:VCPKG_INSTALLATION_ROOT 'installed\x64-windows-static-md-release'
          if (-not (Test-Path -LiteralPath (Join-Path $ffmpegRoot 'lib\avcodec.lib'))) {
            throw 'FFmpeg 静态库没有生成。'
          }
          "FFMPEG_ROOT=$ffmpegRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "NV_CODEC_ROOT=$ffmpegRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: 保存 vcpkg 静态依赖缓存
        if: ${{ steps.vcpkg-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/.vcpkg-binary-cache
          key: vcpkg-ffmpeg-static-md-release-${{ runner.os }}-v2

      - name: 下载 Khronos OpenGL 头文件
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'khronos'
          $header = Join-Path $root 'KHR\khrplatform.h'
          New-Item -ItemType Directory -Force -Path (Split-Path -Parent $header) | Out-Null
          Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/KhronosGroup/EGL-Registry/main/api/KHR/khrplatform.h' -OutFile $header
          "KHRONOS_INCLUDE_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: 下载 DXC
        shell: pwsh
        run: |
          $tag = 'v1.9.2602.24'
          $release = Invoke-RestMethod -Headers @{ 'User-Agent' = 'MediaPlayer-BBS CI' } -Uri "https://api.github.com/repos/microsoft/DirectXShaderCompiler/releases/tags/$tag"
          $asset = $release.assets | Where-Object { $_.name -match 'win.*\.zip$|\.zip$' } | Select-Object -First 1
          if (-not $asset) { throw 'DXC release 中没有找到 Windows 压缩包。' }
          $archive = Join-Path $env:RUNNER_TEMP 'dxc.zip'
          $root = Join-Path $env:RUNNER_TEMP 'dxc'
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $root -Force
          $dxc = Get-ChildItem -LiteralPath $root -Recurse -Filter dxc.exe -File |
            Where-Object { $_.FullName -match '[\\/]bin[\\/]x64[\\/]dxc\.exe$' } |
            Select-Object -First 1
          if (-not $dxc) { throw 'DXC 压缩包中没有 dxc.exe。' }
          "DXC_ROOT=$($dxc.Directory.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: 构建完整 native 后端
        shell: pwsh
        run: .\build-native.ps1 -FfmpegRoot $env:FFMPEG_ROOT -NvCodecRoot $env:NV_CODEC_ROOT -CudaRoot $env:CUDA_PATH -DxcRoot $env:DXC_ROOT -KhronosIncludeRoot $env:KHRONOS_INCLUDE_ROOT

      - name: 准备 native 测试产物
        shell: pwsh
        run: |
          $staging = Join-Path $env:RUNNER_TEMP 'MediaPlayer-native-windows-x64'
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          Copy-Item -LiteralPath 'common/src/main/resources/MediaPlayer.dll' -Destination $staging -Force
          Copy-Item -LiteralPath 'common/src/main/resources/BUILD-MANIFEST.txt' -Destination $staging -Force

      - name: 上传 native 测试产物
        uses: actions/upload-artifact@v4
        with:
          name: MediaPlayer-native-windows-x64
          path: |
            ${{ runner.temp }}/MediaPlayer-native-windows-x64/MediaPlayer.dll
            ${{ runner.temp }}/MediaPlayer-native-windows-x64/BUILD-MANIFEST.txt
          if-no-files-found: error
          retention-days: 14

      - name: 上传 native 调试符号
        uses: actions/upload-artifact@v4
        with:
          name: MediaPlayer-native-symbols-windows-x64
          path: ${{ github.workspace }}/build/native-full/MediaPlayer.pdb
          if-no-files-found: error
          retention-days: 14
